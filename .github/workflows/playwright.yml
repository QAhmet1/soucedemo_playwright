name: Playwright Multi-Environment Tests
on:
  # 1. Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to run tests'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod

  # 2. Automated schedule (Cron) - 07:00 Belgium Time
  # Belgium is UTC+1 (Winter) or UTC+2 (Summer). 
  # 05:00 UTC = 06:00 Belgium Winter / 07:00 Belgium Summer.
  schedule:
    - cron: '0 5 * * *'

  # 3. Trigger on push to main branches
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npm run test:all
      env:
        # Use manual input if available, otherwise default to 'qa'
        ENV: ${{ github.event.inputs.environment || 'qa' }}
        # Mapping GitHub Secrets to System Environment Variables
        QA_URL: ${{ secrets.QA_URL }}
        QA_USER: ${{ secrets.QA_USER }}
        QA_PASS: ${{ secrets.QA_PASS }}
        QA_API_URL: ${{ secrets.QA_API_URL }}
        PROD_URL: ${{ secrets.PROD_URL }}
        PROD_USER: ${{ secrets.PROD_USER }}
        PROD_PASS: ${{ secrets.PROD_PASS }}
        PROD_API_URL: ${{ secrets.PROD_API_URL }}

    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Allure Report Action from marketplace
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages

    - name: Upload Playwright HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15